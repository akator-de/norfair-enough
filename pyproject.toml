[project]
name = "norfair-enough"
version = "2.4.2"
description = "Lightweight Python library for adding real-time multi-object tracking to any detector. Maintained fork of tryolabs/norfair."
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Tryolabs", email = "hello@tryolabs.com" },
]
maintainers = [
    { name = "Akator GmbH", email = "info@akator.de" },
]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "tracking",
    "object-detection",
    "object-tracking",
    "kalman-filter",
    "pose-estimation",
    "re-identification",
    "multi-object-tracking",
    "re-id",
    "tracking-algorithm",
    "deepsort",
    "video-tracking",
    "video-inference-loop",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "rich>=14.0.0",
    "scipy>=1.14.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# motmetrics 1.4.0 is hard-pinned: newer motmetrics is incompatible with
# NumPy 2.x and would force the whole project onto NumPy<2. Revisit once
# upstream releases a numpy-2-compatible version.
metrics = ["motmetrics==1.4.0"]
# Lower bound lifted to 4.8.0: versions below that predate many API
# adjustments (e.g. findHomography parameter order) and have not been
# smoke-tested against the current test suite.
video = ["opencv-python>=4.8.0,<5.0.0"]

[project.urls]
Homepage = "https://github.com/akator-de/norfair-enough"
Documentation = "https://akator-de.github.io/norfair-enough/"
Repository = "https://github.com/akator-de/norfair-enough"
Changelog = "https://github.com/akator-de/norfair-enough/blob/main/CHANGELOG.md"
Issues = "https://github.com/akator-de/norfair-enough/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "mkdocs-material-extensions>=1.3.0",
    "mkdocs-autorefs>=1.4.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocstrings[python]>=0.29.0",
    "mkdocstrings-python>=1.16.0",
    "mike>=2.1.0",
]
test = [
    "pyrefly>=0.50.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff==0.15.10",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "docs/videos/",
    "docs/img/",
    "demos/",
]

[tool.hatch.build.targets.wheel]
packages = ["norfair"]

[tool.pyrefly]
project-includes = ["norfair"]
python-version = "3.10"
replace-imports-with-any = [
    "cv2",
    "motmetrics",
    "pandas",
]

# kalman_filter.py is a vendored/adapted Kalman filter with heavy NumPy
# linear algebra that pyrefly cannot yet type-check accurately.
[[tool.pyrefly.sub-config]]
matches = "norfair/kalman_filter.py"

[tool.pyrefly.sub-config.errors]
bad-assignment = false
bad-unpacking = false
missing-attribute = false
no-matching-overload = false
unsupported-operation = false

[tool.ruff]
line-length = 88
extend-exclude = ["demos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = [
    "E501",    # line length is handled by ruff format
    "SIM108",  # ternary operator suggestions reduce readability
    "SIM115",  # context manager for open() not always applicable
    "B008",    # function calls in defaults (used for factory pattern)
    "B905",    # zip() strict= is noisy for existing code
    "D105",    # missing docstring in magic method (__repr__ etc.)
    "D107",    # missing docstring in __init__ (documented on class)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]    # no docstrings required in tests
"docs/**" = ["D"]     # no docstrings required in docs scripts

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
force-single-line = false
